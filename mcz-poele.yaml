  - platform: template
    id: probe_minutes
    name: "Sonde virtuelle - intervalle demandé"
    unit_of_measurement: "min"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: wifi_signal
    id: wifi_rssi
    name: "Signal WiFi"
    update_interval: ${update_interval}
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: stove_state_text
    name: "État"
    icon: mdi:fireplace
  - platform: template
    id: stove_datetime
    name: "Date et heure du poêle"
    icon: mdi:calendar-clock
    entity_category: diagnostic
  - platform: template
    id: board_fw
    name: "Firmware carte mère"
    icon: mdi:chip
    entity_category: diagnostic

binary_sensor:
  - platform: template
    id: stove_alarm
    name: "Alarme"
    device_class: problem
  - platform: template
    id: candle_state
    name: "Bougie"
    icon: mdi:candle
    entity_category: diagnostic
  - platform: template
    id: brazier_dirty
    name: "Brasier à nettoyer"
    device_class: problem
  - platform: template
    name: "Liaison carte mère"
    device_class: connectivity
    entity_category: diagnostic
    lambda: 'return id(last_reply) != 0 && millis() - id(last_reply) < 60000;'

# Thermostat : regroupe la marche/arret, la consigne, la temperature ambiante et le
# mode de regulation (prereglages Manuel / Automatique, parametre 40).
#   Automatique : le poele module sa puissance selon la consigne
#   Manuel      : le poele fonctionne a la puissance choisie, la consigne est sans effet
# L'etat affiche vient uniquement du poele (optimistic: false) et rien n'est envoye au demarrage.
climate:
  - platform: template
    id: stove_climate
    name: "Thermostat"
    icon: mdi:fireplace
    sensor: ambient_temp
    supported_modes: [ "OFF", "HEAT" ]
    supports_action: true
    custom_presets: [ "Manuel", "Automatique" ]
    optimistic: false
    restore_mode: NO_RESTORE
    visual:
      min_temperature: 5
      max_temperature: 35
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.5
    # Parametre 34 : 1 = allumer, 40 = eteindre
    set_mode_action:
      - lambda: |-
          if (x == climate::CLIMATE_MODE_HEAT) id(mcz_write).execute(34, 1);
          else if (x == climate::CLIMATE_MODE_OFF) id(mcz_write).execute(34, 40);
    # Parametre 40 : 0 = manuel, 1 = automatique
    set_custom_preset_action:
      - lambda: |-
          id(mcz_write).execute(40, x == "Automatique" ? 1 : 0);
    # Parametre 42 : consigne x 2
    set_target_temperature_action:
      - lambda: |-
          id(mcz_write).execute(42, (int) lroundf(x * 2));

switch:
  # Marche / arret. Parametre 34 : 1 = allumer, 40 = eteindre.
  - platform: template
    id: sw_power
    restore_mode: DISABLED      # aucune commande envoyee au demarrage
    name: "Marche"
    icon: mdi:power
    turn_on_action:
      - script.execute: { id: mcz_write, param: 34, value: 1 }
    turn_off_action:
      - script.execute: { id: mcz_write, param: 34, value: 40 }
  - platform: template
    id: sw_eco
    restore_mode: DISABLED      # aucune commande envoyee au demarrage
    name: "Mode éco"
    turn_on_action:
      - script.execute: { id: mcz_write, param: 41, value: 1 }
    turn_off_action:
      - script.execute: { id: mcz_write, param: 41, value: 0 }
  - platform: template
    id: sw_silent
    restore_mode: DISABLED      # aucune commande envoyee au demarrage
    name: "Mode silencieux"
    turn_on_action:
      - script.execute: { id: mcz_write, param: 45, value: 1 }
    turn_off_action:
      - script.execute: { id: mcz_write, param: 45, value: 0 }
  - platform: template
    id: sw_active
    restore_mode: DISABLED      # aucune commande envoyee au demarrage
    name: "Mode Active"
    turn_on_action:
      - script.execute: { id: mcz_write, param: 35, value: 1 }
    turn_off_action:
      - script.execute: { id: mcz_write, param: 35, value: 0 }
  - platform: template
    id: sw_chrono
    restore_mode: DISABLED      # aucune commande envoyee au demarrage
    name: "Chronothermostat"
    turn_on_action:
      - script.execute: { id: mcz_write, param: 1111, value: 1 }
    turn_off_action:
      - script.execute: { id: mcz_write, param: 1111, value: 0 }
  - platform: template
    id: sw_sound
    restore_mode: DISABLED      # aucune commande envoyee au demarrage
    name: "Sons"
    entity_category: config
    turn_on_action:
      - script.execute: { id: mcz_write, param: 50, value: 1 }
    turn_off_action:
      - script.execute: { id: mcz_write, param: 50, value: 0 }
  # Active l'envoi de la temperature Home Assistant au poele. N'envoie aucune commande par lui-meme.
  - platform: template
    id: sw_probe
    name: "Sonde virtuelle"
    icon: mdi:thermometer-auto
    optimistic: true
    restore_mode: ALWAYS_ON     # active a chaque demarrage ; n'envoie rien par lui-meme
    entity_category: config
  # LED sur GPIO12, active a l'etat bas : la broche est forcee a 0 au demarrage, comme dans
  # le firmware d'origine, ce qui allume la LED (temoin de fonctionnement).
  # Interne : non exposee dans Home Assistant.
  - platform: gpio
    pin: GPIO12
    id: led_gpio12
    internal: true
    restore_mode: ALWAYS_OFF

# Mode de regulation : parametre 40.
#   Manuel      : le poele fonctionne a la puissance choisie (entite "Puissance")
#   Automatique : le poele module sa puissance selon la consigne et la temperature ambiante
# Valeurs : 0 = manuel, 1 = automatique.
select:
  - platform: template
    id: sel_control_mode
    name: "Mode de régulation"
    icon: mdi:tune-variant
    options:
      - "Manuel"
      - "Automatique"
    optimistic: false
    set_action:
      - script.execute:
          id: mcz_write
          param: 40
          value: !lambda 'return x == "Automatique" ? 1 : 0;'

  # Ventilations : 0 = No Air (arret), 1 a 5 = vitesse manuelle, 6 = automatique
  - platform: template
    id: sel_fan
    name: "Ventilation"
    icon: mdi:fan
    options: [ "No Air", "1", "2", "3", "4", "5", "Automatique" ]
    optimistic: false
    set_action:
      - script.execute:
          id: mcz_write
          param: 37
          value: !lambda |-
            if (x == "No Air") return 0;
            if (x == "Automatique") return 6;
            return atoi(x.c_str());
  - platform: template
    id: sel_ducted1
    name: "Ventilation canalisée"
    icon: mdi:fan
    options: [ "No Air", "1", "2", "3", "4", "5", "Automatique" ]
    optimistic: false
    set_action:
      - script.execute:
          id: mcz_write
          param: 38
          value: !lambda |-
            if (x == "No Air") return 0;
            if (x == "Automatique") return 6;
            return atoi(x.c_str());

number:
  # Consigne : parametre 42, valeur = temperature x 2
  - platform: template
    id: num_setpoint
    name: "Consigne"
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 5
    max_value: 35
    step: 0.5
    mode: box
    set_action:
      - script.execute:
          id: mcz_write
          param: 42
          value: !lambda 'return (int) (x * 2);'
  # Reglage de la puissance, utile en mode manuel seulement. En mode automatique le poele
  # module seul sa puissance : l'ecriture est ignoree.
  # Le parametre 36 prend les valeurs 11 a 15 pour les puissances 1 a 5.
  - platform: template
    id: num_power
    name: "Puissance (réglage)"
    icon: mdi:fire
    min_value: 1
    max_value: 5
    step: 1
    set_action:
      - lambda: |-
          if (id(control_mode) == 1) {
            ESP_LOGW("mcz", "Reglage de puissance ignore : le poele est en mode automatique");
            return;
          }
          id(mcz_write).execute(36, (int) x + 10);

button:
  - platform: template
    name: "Actualiser"
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: mcz_send
          cmd: "C|RecuperoInfo"
  - platform: template
    name: "Acquitter l'alarme"
    icon: mdi:alarm-light-off
    on_press:
      - script.execute: { id: mcz_write, param: 1, value: 255 }
  - platform: template
    name: "Régler l'heure du poêle"
    icon: mdi:clock-check
    entity_category: config
    on_press:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          char buf[40];
          snprintf(buf, sizeof(buf), "C|SalvaDataOra|%02d%02d%04d%02d%02d",
                   t.day_of_month, t.month, t.year, t.hour, t.minute);
          id(tx_queue).push_back(buf);
  - platform: restart
    name: "Redémarrer le module"
    entity_category: diagnostic
