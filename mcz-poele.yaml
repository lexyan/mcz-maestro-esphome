  - platform: template
    id: ignitions
    name: "Nombre d'allumages"
    icon: mdi:fire
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic
  # --- Sonde virtuelle ---
  - platform: homeassistant
    id: ha_room_temp
    entity_id: ${room_temp_entity}
    internal: true
  - platform: template
    id: probe_sent
    name: "Sonde virtuelle - température envoyée"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: template
    id: probe_readback
    name: "Sonde WiFi 1 (lue par le poêle)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
