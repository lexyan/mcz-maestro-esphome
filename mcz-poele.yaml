# ESPHome pour le module WiFi "remote" d'un poele MCZ Maestro (ESP8266, 2 Mo de flash)
#
# Remplace le firmware Fluidsoft "MCZ-RemoteService" 1.2.5. Le module parle a la
# carte mere par la liaison serie, avec le meme protocole que le firmware d'origine :
#   envoi   : <commande>^\r\n        (ex. C|RecuperoInfo^)
#   reponse : champs hexadecimaux separes par | et termines par ^
# La table des champs et des commandes vient du projet Chibald/maestrogateway.
#
# secrets.yaml attendu : wifi_ssid, wifi_password, esphome_encryption_key, ap_wifi_password

substitutions:
  name: mcz-ego2
  friendly_name: Poêle MCZ Ego 2
  poll_interval: 15s
  reboot_timeout: 14d
  update_interval: 60s
  # Capteur Home Assistant envoye au poele a la place de la sonde WiFi deportee
  room_temp_entity: sensor.snzb_02d_temperature_6_rec

preferences:
  flash_write_interval: never

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      # Annonce a la carte mere, comme le firmware d'origine au demarrage
      - lambda: |-
          std::string mac = get_mac_address();
          for (auto &ch : mac) ch = toupper(ch);
          id(tx_queue).push_back("RispostaAccensioneRemoto|" + mac + "|1.2.6");
      - script.execute:
          id: mcz_send
          cmd: "C|RecuperoInfo"

esp8266:
  board: esp_wroom_02          # ESP8266 generique avec 2 Mo de flash

# La liaison serie principale est reservee au poele : pas de logs dessus
logger:
  baud_rate: 0
  level: DEBUG

api:
  reboot_timeout: ${reboot_timeout}
  encryption:
    key: !secret esphome_encryption_key
  actions:
    # Envoi d'une trame brute depuis Home Assistant, sans le ^ final.
    # Exemple : C|WriteParametri|42|43   (consigne a 21,5 degres)
    - action: send_command
      variables:
        command: string
      then:
        - script.execute:
            id: mcz_send
            cmd: !lambda 'return command;'

ota:
  - platform: esphome
    encryption:              # vide : utilise la cle de chiffrement de l'API

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: ${reboot_timeout}
  ap:
    ssid: ${name}-secours
    password: !secret ap_wifi_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

uart:
  id: stove_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200
  rx_buffer_size: 1024

status_led:
  pin: GPIO13

globals:
  - id: rx_frame
    type: std::string
  - id: tx_queue
    type: std::vector<std::string>
  - id: busy
    type: bool
    initial_value: 'false'
  - id: busy_since
    type: uint32_t
    initial_value: '0'
  - id: last_reply
    type: uint32_t
    initial_value: '0'
  # Mode de regulation recu du poele : -1 = inconnu, 0 = manuel, 1 = automatique
  - id: control_mode
    type: int
    initial_value: '-1'
  # Sonde virtuelle
  - id: last_cmd
    type: std::string
  - id: probe_interval_s          # intervalle entre deux envois, ajuste par la reponse du poele
    type: uint32_t
    initial_value: '300'
  - id: probe_last_send
    type: uint32_t
    initial_value: '0'

script:
  # Met une commande en file d'attente. Une seule commande a la fois sur la liaison serie.
  - id: mcz_send
    mode: queued
    max_runs: 10
    parameters:
      cmd: string
    then:
      - lambda: |-
          if (id(tx_queue).size() < 10) id(tx_queue).push_back(cmd);

  - id: mcz_write
    mode: queued
    max_runs: 10
    parameters:
      param: int
      value: int
    then:
      - lambda: |-
          // Securite : aucune ecriture pendant les 20 premieres secondes apres le demarrage
          if (millis() < 20000) {
            ESP_LOGW("mcz", "Ecriture %d=%d ignoree (demarrage en cours)", param, value);
            return;
          }
          id(tx_queue).push_back("C|WriteParametri|" + to_string(param) + "|" + to_string(value));
          id(tx_queue).push_back("C|RecuperoInfo");

interval:
  - interval: ${poll_interval}
    then:
      - script.execute:
          id: mcz_send
          cmd: "C|RecuperoInfo"

  # Sonde virtuelle : envoie la temperature de Home Assistant a la place de la sonde WiFi.
  # Meme trame que la sonde d'origine : C|RecuperaTemperaturaWiFi|51|<T x 2>|1.9.9|00|<qualite WiFi>
  - interval: 10s
    then:
      - if:
          condition:
            and:
              - switch.is_on: sw_probe
              - api.connected:          # pas d'envoi si Home Assistant est injoignable
          then:
            - lambda: |-
                if (millis() < 30000) return;
                if (id(probe_last_send) != 0 &&
                    millis() - id(probe_last_send) < id(probe_interval_s) * 1000UL) return;
                float t = id(ha_room_temp).state;
                if (std::isnan(t)) return;               // capteur indisponible : rien n'est envoye
                if (t < 0 || t > 100) t = 0;             // meme regle que la sonde d'origine
                float rssi = id(wifi_rssi).state;
                int quality = std::isnan(rssi) ? 100 : (rssi <= -100 ? 0 : (rssi >= -50 ? 100 : 2 * ((int) rssi + 100)));
                int half = (int) lroundf(t * 2);         // arrondi au demi-degre le plus proche
                char buf[64];
                snprintf(buf, sizeof(buf), "C|RecuperaTemperaturaWiFi|51|%d|1.9.9|00|%d", half, quality);
                id(tx_queue).push_back(buf);
                id(probe_last_send) = millis();
                id(probe_sent).publish_state(half / 2.0f);

  # Moteur serie : lecture des reponses, puis envoi de la commande suivante
  - interval: 50ms
    then:
      - lambda: |-
          uint8_t c;
          while (id(stove_uart).available()) {
            id(stove_uart).read_byte(&c);
            if (c == '\r' || c == '\n') continue;
            if (c != '^') {
              if (id(rx_frame).size() < 1024) id(rx_frame).push_back((char) c);
              continue;
            }

            // --- Trame complete ---
            std::string frame = id(rx_frame);
            id(rx_frame).clear();
            id(busy) = false;
            id(last_reply) = millis();
            size_t p;
            while ((p = frame.find("%7C")) != std::string::npos) frame.replace(p, 3, "|");
            ESP_LOGD("mcz", "Recu : %s", frame.c_str());

            std::vector<std::string> f;
            size_t start = 0;
            while (true) {
              size_t end = frame.find('|', start);
              f.push_back(frame.substr(start, end == std::string::npos ? end : end - start));
              if (end == std::string::npos) break;
              start = end + 1;
            }
            // Reponse a la sonde virtuelle : 2 caracteres hexa = minutes avant le prochain envoi
            if (id(last_cmd).rfind("C|RecuperaTemperaturaWiFi", 0) == 0) {
              id(last_cmd).clear();
              if (frame.size() >= 2 && isxdigit(frame[0]) && isxdigit(frame[1])) {
                int minutes = (int) strtol(frame.substr(0, 2).c_str(), nullptr, 16);
                id(probe_minutes).publish_state(minutes);
                if (minutes < 1) minutes = 1;
                if (minutes > 30) minutes = 30;
                id(probe_interval_s) = minutes * 60;
              }
              continue;
            }
            id(last_cmd).clear();

            if (f[0] != "01") continue;          // seules les trames d'information sont decodees

            auto has = [&](size_t i) { return i < f.size() && !f[i].empty(); };
            auto *cl = id(stove_climate);
            const auto cl_mode = cl->mode;
            const auto cl_action = cl->action;
            const float cl_target = cl->target_temperature;
            bool cl_changed = false;
            auto num = [&](size_t i) { return (float) strtol(f[i].c_str(), nullptr, 16); };

            if (has(1)) {
              int st = (int) num(1);
              id(stove_state).publish_state(st);
              const char *txt = "Inconnu";
              switch (st) {
                case 0: txt = "Éteint"; break;
                case 1: txt = "Contrôle chaud/froid"; break;
                case 2: txt = "Nettoyage à froid"; break;
                case 3: txt = "Chargement pellets à froid"; break;
                case 4: txt = "Démarrage 1 à froid"; break;
                case 5: txt = "Démarrage 2 à froid"; break;
                case 6: txt = "Nettoyage à chaud"; break;
                case 7: txt = "Chargement pellets à chaud"; break;
                case 8: txt = "Démarrage 1 à chaud"; break;
                case 9: txt = "Démarrage 2 à chaud"; break;
                case 10: txt = "Stabilisation"; break;
                case 11: txt = "Puissance 1"; break;
                case 12: txt = "Puissance 2"; break;
                case 13: txt = "Puissance 3"; break;
                case 14: txt = "Puissance 4"; break;
                case 15: txt = "Puissance 5"; break;
                case 30: case 48: txt = "Diagnostic"; break;
                case 31: txt = "Allumé"; break;
                case 40: txt = "Extinction"; break;
                case 41: txt = "Refroidissement"; break;
                case 42: txt = "Nettoyage bas"; break;
                case 43: txt = "Nettoyage haut"; break;
                case 44: txt = "Déblocage vis"; break;
                case 45: txt = "Auto éco"; break;
                case 46: txt = "Veille"; break;
                case 49: txt = "Chargement vis"; break;
                case 50: txt = "A01 - Allumage raté"; break;
                case 51: txt = "A02 - Pas de flamme"; break;
                case 52: txt = "A03 - Surchauffe réservoir"; break;
                case 53: txt = "A04 - Fumées trop chaudes"; break;
                case 54: txt = "A05 - Conduit obstrué / vent"; break;
                case 55: txt = "A06 - Tirage insuffisant"; break;
                case 56: txt = "A09 - Sonde fumées"; break;
                case 57: txt = "A11 - Motoréducteur"; break;
                case 58: txt = "A13 - Température carte mère"; break;
                case 59: txt = "A14 - Défaut Active"; break;
                case 60: txt = "A18 - Température eau"; break;
                case 61: txt = "A19 - Sonde eau"; break;
                case 62: txt = "A20 - Sonde auxiliaire"; break;
                case 63: txt = "A21 - Pressostat"; break;
                case 64: txt = "A22 - Sonde ambiante"; break;
                case 65: txt = "A23 - Fermeture brasier"; break;
                case 66: txt = "A12 - Contrôle motoréducteur"; break;
                case 67: txt = "A17 - Vis sans fin bloquée"; break;
                case 69: txt = "Attente alarmes sécurité"; break;
              }
              id(stove_state_text).publish_state(txt);
              // Etats consideres "en marche" par maestrogateway : 1 a 15, 31, 40 a 43
              bool on = (st >= 1 && st <= 15) || st == 31 || (st >= 40 && st <= 43);
              id(sw_power).publish_state(on);
              // Thermostat : chauffe en phase d'allumage et de combustion (1 a 15, 31),
              // en attente en auto eco / veille (45, 46), arret dans tous les autres etats
              bool burning = (st >= 1 && st <= 15) || st == 31;
              bool waiting = st == 45 || st == 46;
              cl->set_mode((burning || waiting) ? climate::CLIMATE_MODE_HEAT : climate::CLIMATE_MODE_OFF);
              cl->action = burning ? climate::CLIMATE_ACTION_HEATING
                         : waiting ? climate::CLIMATE_ACTION_IDLE
                                   : climate::CLIMATE_ACTION_OFF;
              id(stove_alarm).publish_state(st >= 50 && st <= 67);
            }
            // Ventilations : 0 = No Air (arret), 1 a 5 = vitesse manuelle, 6 = automatique
            auto fan_option = [](int v) -> const char * {
              static const char *const OPTS[] = {"No Air", "1", "2", "3", "4", "5", "Automatique"};
              return (v >= 0 && v <= 6) ? OPTS[v] : nullptr;
            };
            if (has(2)) { const char *o = fan_option((int) num(2)); if (o) id(sel_fan).publish_state(o); }
            if (has(3)) { const char *o = fan_option((int) num(3)); if (o) id(sel_ducted1).publish_state(o); }
            if (has(5))  id(fume_temp).publish_state(num(5));
            if (has(6))  id(ambient_temp).publish_state(num(6) / 2.0f);
            if (has(12)) id(fume_fan_rpm).publish_state(num(12));
            if (has(10)) id(candle_state).publish_state(num(10) != 0);   // 0 = bougie eteinte
            if (has(11)) id(active_set).publish_state(num(11));
            if (has(13)) id(auger_rpm_set).publish_state(num(13));
            if (has(14)) id(auger_rpm).publish_state(num(14));
            if (has(21)) id(active_live).publish_state(num(21));
            if (has(46)) id(active_temp).publish_state(num(46));
            if (has(32) && has(33) && has(34) && has(35) && has(36)) {   // date et heure du poele
              char dt[24];
              snprintf(dt, sizeof(dt), "%04d-%02d-%02d %02d:%02d",
                       (int) num(36), (int) num(35), (int) num(34), (int) num(32), (int) num(33));
              id(stove_datetime).publish_state(dt);
            }
            if (has(17)) id(brazier_dirty).publish_state(num(17) != 0);
            if (has(18)) id(profile).publish_state(num(18));
            if (has(20)) id(sw_active).publish_state(num(20) != 0);
            if (has(22)) {                       // mode de regulation : 0 = manuel, 1 = automatique
              int cm = (int) num(22);
              if (cm == 0 || cm == 1) {
                const char *label = cm == 1 ? "Automatique" : "Manuel";
                id(sel_control_mode).publish_state(label);
                if (cm != id(control_mode)) {    // prereglage du thermostat
                  id(control_mode) = cm;
                  cl->set_custom_preset(label);
                  cl_changed = true;
                }
              } else {
                ESP_LOGW("mcz", "Mode de regulation inconnu : %d", cm);
              }
            }
            if (has(23)) id(sw_eco).publish_state(num(23) != 0);
            if (has(24)) id(sw_silent).publish_state(num(24) != 0);
            if (has(25)) id(sw_chrono).publish_state(num(25) != 0);
            if (has(26)) {
              id(num_setpoint).publish_state(num(26) / 2.0f);
              cl->set_target_temperature(num(26) / 2.0f);
            }
            if (has(28)) id(board_temp).publish_state(num(28) / 2.0f);
            if (has(29)) {                       // la carte mere renvoie 11 a 15 pour les puissances 1 a 5
              float pw = num(29);
              pw = pw > 10 ? pw - 10 : pw;
              id(num_power).publish_state(pw);
              id(power_level).publish_state(pw);
            }
            if (has(30)) {                       // 3 octets : majeur.mineur.correctif (0x010802 = 1.8.2)
              long v = strtol(f[30].c_str(), nullptr, 16);
              char ver[16];
              snprintf(ver, sizeof(ver), "%ld.%ld.%ld", (v >> 16) & 0xFF, (v >> 8) & 0xFF, v & 0xFF);
              id(board_fw).publish_state(ver);
            }
            if (has(37)) id(total_hours).publish_state(num(37) / 3600.0f);
            if (has(38)) id(total_hours_p1).publish_state(num(38) / 3600.0f);
            if (has(39)) id(total_hours_p2).publish_state(num(39) / 3600.0f);
            if (has(40)) id(total_hours_p3).publish_state(num(40) / 3600.0f);
            if (has(41)) id(total_hours_p4).publish_state(num(41) / 3600.0f);
            if (has(42)) id(total_hours_p5).publish_state(num(42) / 3600.0f);
            if (has(43)) id(hours_to_service).publish_state(num(43));
            if (has(45)) id(ignitions).publish_state(num(45));
            if (has(49)) id(sw_sound).publish_state(num(49) != 0);
            if (has(52)) id(probe_readback).publish_state(num(52) / 2.0f);

            // Thermostat : publication seulement si quelque chose a change
            if (cl_changed || cl->mode != cl_mode || cl->action != cl_action ||
                (cl->target_temperature != cl_target &&
                 !(std::isnan(cl->target_temperature) && std::isnan(cl_target))))
              cl->publish_state();
          }

          // Pas de reponse en 2 s : on libere la liaison
          if (id(busy) && millis() - id(busy_since) > 2000) {
            id(busy) = false;
            id(rx_frame).clear();
          }

          if (!id(busy) && !id(tx_queue).empty()) {
            std::string cmd = id(tx_queue).front();
            id(tx_queue).erase(id(tx_queue).begin());
            ESP_LOGD("mcz", "Envoi : %s", cmd.c_str());
            id(last_cmd) = cmd;
            id(stove_uart).write_str((cmd + "^\r\n").c_str());
            id(busy) = true;
            id(busy_since) = millis();
          }

