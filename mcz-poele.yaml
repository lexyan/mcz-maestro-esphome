    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: template
    id: total_hours_p2
    name: "Heures de fonctionnement Puissance 2"
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: template
    id: total_hours_p3
    name: "Heures de fonctionnement Puissance 3"
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: template
    id: total_hours_p4
    name: "Heures de fonctionnement Puissance 4"
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: template
    id: total_hours_p5
    name: "Heures de fonctionnement Puissance 5"
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
