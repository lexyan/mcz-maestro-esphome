    name: "Température ambiante"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: fume_temp
    name: "Température fumées"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    id: board_temp
    name: "Température carte mère"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: template
    id: fume_fan_rpm
    name: "Extracteur fumées"
    unit_of_measurement: "tr/min"
    icon: mdi:fan
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: auger_rpm
